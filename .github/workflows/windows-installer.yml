name: Windows installer

# Builds the self-contained Windows .exe installer. Run it by hand from the
# Actions tab, or push a version tag (v1.2.3) to build and attach it to a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (e.g. 0.1.0)"
        required: false
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to attach the installer to a release on a tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ github.ref_name }}" -replace '^v', '' }
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "0.1.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: ./installer/windows/build.ps1 -AppVersion "${{ steps.ver.outputs.version }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-agent-windows-installer
          path: installer/windows/dist/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/windows/dist/*.exe
