name: Windows installer

# Builds the self-contained Windows .exe installer. Run it by hand from the
# Actions tab (it then publishes a GitHub Release so the in-app updater finds it),
# or push a version tag (v1.2.3) to build and attach it to that tag's release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (e.g. 0.1.0)"
        required: false
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to attach the installer to a release on a tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ github.ref_name }}" -replace '^v', '' }
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "0.1.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: ./installer/windows/build.ps1 -AppVersion "${{ steps.ver.outputs.version }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-agent-windows-installer
          path: installer/windows/dist/*.exe
          if-no-files-found: error

      - name: Attach installer to release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/windows/dist/*.exe

      # A manual run publishes a release tagged v<version> at this commit and
      # attaches the .exe, so S.Gain Studio's "Check for updates" finds it. The
      # tag is created by GITHUB_TOKEN, which does not retrigger this workflow.
      - name: Publish release (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: installer/windows/dist/*.exe
          fail_on_unmatched_files: true
          body: |
            S.Gain Studio / AI Video Agent ${{ steps.ver.outputs.version }}

            Download **ai-video-agent-setup-${{ steps.ver.outputs.version }}.exe** below and run it to install or update on Windows 11. The app's **Settings → Check for updates** also links here.
